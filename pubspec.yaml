name: guardian_shield_app
description: "Guardian Shield - Production-grade personal safety and emergency mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0

  # Hardware Sensors & Location
  sensors_plus: ^5.0.1
  geolocator: ^12.0.0
  camera: ^0.11.0+1
  permission_handler: ^11.3.1
  flutter_foreground_task: ^6.1.1

  # Communication & Telephony & Payments
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.2
  telephony: ^0.2.0
  flutter_phone_direct_caller: ^2.1.1
  razorpay_flutter: ^1.3.7

  # Sharing & Opening Files
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.3
  gal: ^2.3.1

  # Security & AES-256 Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Firebase Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
